<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Registration | Dr. Zafrullah Chowdhury Memorial Inter-Department Debate Competition 2026</title>
<meta name="description" content="Register Team for the Dr. Zafrullah Chowdhury Memorial Inter-Department Debate Competition 2026 (Season 04). Asian Parliamentary (Bangla) and British Parliamentary (English). 23-24 November 2026.">
<meta property="og:title" content="Adjudicator Team | Dr. Zafrullah Chowdhury Memorial Inter-Department Debate 2026">
<meta property="og:description" content="Drop in. Argue. Survive the break. Register Adjudicator now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =====================================================
   CONFIG-FREE STYLES  (edit the CONFIG block in the script at the bottom)
   ===================================================== */
:root{
  --ink:#0b110d;
  --olive:#171d15;
  --olive-2:#222b1f;
  --khaki:#c9b36a;
  --gold:#f2b632;
  --red:#c8392b;
  --navy:#0e2447;
  --sky:#6fa3dc;
  --haze:#f3d9a2;
  --paper:#f4efe1;
  --line:rgba(201,179,106,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Rajdhani','Noto Sans Bengali',system-ui,sans-serif;
  font-weight:500;font-size:18px;line-height:1.5;
  background:var(--ink);color:var(--paper);
  overflow-x:hidden;
}
a{color:inherit}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}

/* ---------- compass bar ---------- */
.compass{
  position:sticky;top:0;z-index:50;
  background:rgba(11,17,13,.88);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.compass .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Black Ops One',sans-serif;letter-spacing:.06em;font-size:15px;color:var(--gold);text-decoration:none}
.logo-slot{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--khaki);display:grid;place-items:center;overflow:hidden;
  background:var(--olive-2);font-size:9px;color:var(--khaki);font-family:'Share Tech Mono',monospace;text-align:center;line-height:1;
}
.logo-slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.ticks{
  flex:1;max-width:420px;height:28px;position:relative;overflow:hidden;
  font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--khaki);
  mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);
}
.ticks span{
  position:absolute;left:0;top:0;white-space:nowrap;letter-spacing:.9em;
  animation:drift 40s linear infinite;
}
.ticks::after{content:"";position:absolute;left:50%;top:0;width:2px;height:8px;background:var(--gold);transform:translateX(-50%)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.nav-cta{
  font-family:'Black Ops One',sans-serif;font-size:13px;letter-spacing:.08em;text-decoration:none;
  padding:9px 16px;background:var(--gold);color:#241a00;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.nav-cta:hover{background:#ffd062}

/* ---------- hero ---------- */
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  padding:70px 0 120px;text-align:center;
  background:
    radial-gradient(ellipse 60% 35% at 20% 55%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(ellipse 55% 30% at 82% 40%,rgba(255,255,255,.45),transparent 70%),
    radial-gradient(ellipse 80% 40% at 50% 85%,rgba(255,226,160,.9),transparent 70%),
    linear-gradient(180deg,#5d94d3 0%,#9dbfe6 38%,#efd8a4 72%,#2a3022 100%);
}
.hero::after{ /* ground silhouette + dark fade into page */
  content:"";position:absolute;inset:auto 0 0 0;height:180px;z-index:-1;
  background:
    linear-gradient(180deg,transparent,var(--ink) 92%),
    repeating-linear-gradient(90deg,rgba(23,29,21,.0) 0 40px,rgba(23,29,21,.35) 40px 90px);
}
.plane{
  position:absolute;left:50%;top:-18px;width:min(520px,78vw);transform:translateX(-50%);
  z-index:-1;opacity:.92;filter:drop-shadow(0 18px 20px rgba(0,0,0,.35));
  animation:hover 7s ease-in-out infinite;
}
@keyframes hover{50%{transform:translateX(-50%) translateY(10px)}}
.chute{position:absolute;z-index:-1;width:70px;animation:float 9s ease-in-out infinite}
.chute.c1{left:7%;top:150px}
.chute.c2{right:9%;top:250px;width:56px;animation-delay:-3s}
.chute.c3{left:20%;top:330px;width:44px;animation-delay:-6s;opacity:.8}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(22px) rotate(3deg)}}
.fighter{position:absolute;z-index:-1;width:64px;opacity:.7;animation:fly 22s linear infinite}
.fighter.f1{top:210px;right:-80px}
.fighter.f2{top:410px;left:-80px;animation-direction:reverse;animation-duration:28s;transform:scaleX(-1)}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(-120vw)}}

.badge-row{margin-top:210px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.eyebrow{
  display:inline-block;font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:.2em;
  background:rgba(11,17,13,.78);color:var(--gold);padding:6px 14px;border:1px solid var(--line);
}
.title-card{
  position:relative;display:inline-block;margin-top:18px;padding:26px 34px 30px;
  background:rgba(255,255,255,.88);border:4px solid #fff;border-radius:22px;
  box-shadow:0 0 0 3px var(--navy),0 22px 50px rgba(0,0,0,.35);
  max-width:100%;
}
.title-card .dr{font-family:'Black Ops One',sans-serif;font-size:clamp(22px,4vw,38px);color:var(--navy);letter-spacing:.04em;line-height:1}
.title-card .name{
  font-family:'Black Ops One',sans-serif;font-size:clamp(34px,8vw,84px);line-height:1;color:var(--red);
  -webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:3px 4px 0 var(--navy);
}
.title-card .mem{
  font-family:'Black Ops One',sans-serif;font-size:clamp(26px,6vw,58px);line-height:1.05;color:#b78610;
  -webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:3px 4px 0 var(--navy);
}
.title-card .sub{
  font-family:'Black Ops One',sans-serif;font-size:clamp(20px,4.6vw,44px);line-height:1.1;color:var(--navy);margin-top:4px;
}
.title-card .season{font-family:'Black Ops One',sans-serif;font-size:clamp(13px,2vw,20px);color:var(--red);letter-spacing:.1em}
.pills{margin-top:26px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.pill{
  background:var(--navy);color:#fff;padding:9px 22px;border-radius:999px;font-weight:700;font-size:18px;
  border:2px solid rgba(255,255,255,.7);box-shadow:0 6px 16px rgba(0,0,0,.3);
}
.pill b{color:var(--haze);font-weight:700}
.pill.date{background:#fff;color:var(--red);border-color:var(--red);font-size:22px}

/* ---------- countdown ---------- */
.countdown{
  position:relative;margin:40px auto 0;max-width:720px;padding:22px 18px 20px;
  background:rgba(11,17,13,.86);border:1px solid var(--line);
}
.countdown::before,.countdown::after,.countdown .cn1,.countdown .cn2{
  content:"";position:absolute;width:18px;height:18px;border:3px solid var(--gold)
}
.countdown::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.countdown::after{right:-3px;top:-3px;border-left:0;border-bottom:0}
.countdown .cn1{left:-3px;bottom:-3px;border-right:0;border-top:0}
.countdown .cn2{right:-3px;bottom:-3px;border-left:0;border-top:0}
.cd-label{font-family:'Share Tech Mono',monospace;letter-spacing:.25em;font-size:14px;color:var(--khaki);margin-bottom:12px}
.cd-label i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4b3a;margin-right:8px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd-cell{background:var(--olive-2);border:1px solid rgba(201,179,106,.25);padding:12px 4px 8px}
.cd-num{font-family:'Share Tech Mono',monospace;font-size:clamp(34px,8vw,64px);line-height:1;color:#fff;text-shadow:0 0 18px rgba(242,182,50,.45)}
.cd-unit{font-size:13px;letter-spacing:.22em;color:var(--khaki);margin-top:6px;font-weight:700}
.cd-msg{display:none;font-family:'Black Ops One',sans-serif;font-size:clamp(24px,5vw,40px);color:var(--gold);padding:12px 0}
.countdown.done .cd-grid{display:none}
.countdown.done .cd-msg{display:block}
.cta{
  display:inline-block;margin-top:34px;text-decoration:none;
  font-family:'Black Ops One',sans-serif;font-size:20px;letter-spacing:.1em;
  padding:16px 38px;background:var(--gold);color:#241a00;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  transition:transform .15s, background .15s;
}
.cta:hover{background:#ffd062;transform:translateY(-2px)}
.cta small{display:block;font-family:'Rajdhani';font-size:13px;letter-spacing:.2em;font-weight:700;margin-top:2px}

/* ---------- section scaffolding ---------- */
section.block{padding:70px 0}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.sec-head .tag{font-family:'Share Tech Mono',monospace;color:var(--gold);font-size:15px;letter-spacing:.2em}
.sec-head h2{font-family:'Black Ops One',sans-serif;font-weight:400;font-size:clamp(26px,5vw,42px);letter-spacing:.04em}
.sec-head .bn{font-family:'Noto Sans Bengali',sans-serif;font-weight:700;color:var(--khaki);font-size:20px}

/* ---------- briefing cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{
  position:relative;padding:22px 22px 20px;background:linear-gradient(160deg,var(--olive-2),var(--olive));
  border:1px solid var(--line);
}
.card::before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:var(--gold)}
.card h3{font-family:'Black Ops One',sans-serif;font-weight:400;font-size:20px;letter-spacing:.06em;color:var(--gold);margin-bottom:6px}
.card .big{font-size:26px;font-weight:700;color:#fff;line-height:1.15}
.card p{color:#d6d0bd;margin-top:6px;font-size:17px}
.card .lang{display:inline-block;margin-top:10px;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.12em;padding:3px 10px;border:1px solid var(--khaki);color:var(--khaki)}

/* ---------- registration frame ---------- */
.drop{background:
  linear-gradient(180deg,rgba(11,17,13,.0),rgba(34,43,31,.55) 20%,rgba(34,43,31,.55) 80%,rgba(11,17,13,0)),
  repeating-linear-gradient(45deg,rgba(201,179,106,.04) 0 12px,transparent 12px 24px);
}
.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;background:rgba(11,17,13,.6);border:1px solid rgba(201,179,106,.2)}
.step .n{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--gold);color:#241a00;font-family:'Black Ops One',sans-serif;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.step b{display:block;color:#fff;font-size:18px}
.step span{color:#cfc8b0;font-size:16px;line-height:1.3;display:block}
.frame{border:1px solid var(--line);background:var(--paper);color:#17210f;position:relative}
.frame-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--olive);color:var(--gold);padding:10px 16px;
  font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:.18em;
}
.frame-head a{color:var(--paper);text-decoration:underline;letter-spacing:.06em;font-size:14px}
#tcFrame{display:block;width:100%;height:1400px;border:0;background:#fff}
.placeholder{padding:46px 24px;text-align:center}
.placeholder h3{font-family:'Black Ops One',sans-serif;font-weight:400;color:var(--navy);font-size:26px;margin-bottom:8px}
.placeholder p{max-width:520px;margin:0 auto 18px;color:#3a4430}
.placeholder code{background:#e7e0c8;padding:2px 6px;font-family:'Share Tech Mono',monospace;font-size:15px}
.btn-dark{
  display:inline-block;text-decoration:none;background:var(--navy);color:#fff;
  font-family:'Black Ops One',sans-serif;letter-spacing:.08em;padding:13px 28px;font-size:17px;
}
.btn-dark:hover{background:#17376b}
.closed-banner{display:none;background:#7a1d14;color:#fff;text-align:center;padding:12px;font-weight:700;letter-spacing:.06em}
.closed .closed-banner{display:block}
.help{margin-top:16px;color:#bdb79f;font-size:16px}
.help a{color:var(--gold)}

/* ---------- footer ---------- */
footer{padding:50px 0 60px;text-align:center;border-top:1px solid var(--line);background:#080c09}
footer .org-lbl{font-family:'Share Tech Mono',monospace;letter-spacing:.35em;color:var(--khaki);font-size:13px}
footer .org{margin-top:10px;font-size:clamp(18px,3vw,26px);font-weight:700;color:#fff;line-height:1.35}
footer .logos{display:flex;justify-content:center;gap:16px;margin-top:22px}
footer .logos .logo-slot{width:58px;height:58px}
footer .fine{margin-top:22px;color:#8d8870;font-size:14px;font-family:'Share Tech Mono',monospace;letter-spacing:.06em}

@media (max-width:640px){
  .ticks{display:none}
  .badge-row{margin-top:170px}
  .title-card{padding:18px 16px 22px}
  .cd-grid{gap:6px}
  #tcFrame{height:1700px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important}
}

/* ---------- memorial portrait ---------- */
.portrait{
  width:clamp(120px,22vw,168px);aspect-ratio:396/484;margin:14px auto 10px;
  border:4px solid #fff;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 3px var(--navy),0 10px 24px rgba(0,0,0,.35);
}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}

/* ---------- light bottom (no black area) ---------- */
body{background:linear-gradient(180deg,#efd8a4 0%,#f6e7c4 45%,#f4efe1 100%) fixed;color:#17210f}
.hero{
  background:
    radial-gradient(ellipse 60% 35% at 20% 55%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(ellipse 55% 30% at 82% 40%,rgba(255,255,255,.45),transparent 70%),
    linear-gradient(180deg,#5d94d3 0%,#9dbfe6 38%,#efd8a4 100%);
  padding-bottom:70px;
}
.hero::after{display:none}
.drop{background:transparent}
.sec-head h2{color:var(--navy)}
.sec-head .tag{color:#a8741a}
.sec-head .bn{color:#a8741a}
.help{color:#3a4430}
.help a{color:var(--navy);font-weight:700}
section.block{padding:30px 0 70px}
</style>
</head>

<!-- ============ HERO ============ -->
<main id="top">
<div class="hero">
  <!-- bomber, front view -->
  <svg class="plane" viewBox="0 0 520 230" aria-hidden="true">
    <path d="M6 108 Q260 70 514 108 L514 128 Q260 104 6 128 Z" fill="url(#metal)"/>
    <ellipse cx="260" cy="118" rx="62" ry="80" fill="url(#metal)"/>
    <ellipse cx="260" cy="96" rx="44" ry="46" fill="#1b2227" opacity=".85"/>
    <path d="M222 82 L298 82 M260 56 L260 140 M232 70 L288 70 M232 96 L288 96" stroke="#7d8890" stroke-width="3"/>
    <g>
      <circle cx="140" cy="116" r="50" fill="url(#metal)"/>
      <circle cx="140" cy="116" r="34" fill="#1a2024"/><circle cx="140" cy="116" r="12" fill="#7d8890"/>
      <circle cx="380" cy="116" r="50" fill="url(#metal)"/>
      <circle cx="380" cy="116" r="34" fill="#1a2024"/><circle cx="380" cy="116" r="12" fill="#7d8890"/>
    </g>
    <path d="M196 196 L260 214 L324 196 L260 176 Z" fill="#2a3338"/>
  </svg>

  <svg class="chute c1" viewBox="0 0 100 130" aria-hidden="true"><use href="#parachute"/></svg>
  <svg class="chute c2" viewBox="0 0 100 130" aria-hidden="true"><use href="#parachute"/></svg>
  <svg class="chute c3" viewBox="0 0 100 130" aria-hidden="true"><use href="#parachute"/></svg>
  <svg class="fighter f1" viewBox="0 0 100 60" aria-hidden="true"><use href="#fighter"/></svg>
  <svg class="fighter f2" viewBox="0 0 100 60" aria-hidden="true"><use href="#fighter"/></svg>

  <div class="wrap">
    <div class="badge-row">
      <span class="eyebrow">SEASON 04</span>
      <span class="eyebrow">Team REG FORM</span>
    </div>

    <div class="title-card">

<script>
/* =====================================================
   CONFIG  - edit these
   ===================================================== */
const CONFIG = {
  // Countdown target: first day of the event, Dhaka time (UTC+6)
  EVENT_START: "2026-11-23T00:00:00+06:00",
  // End of the event (after this the timer says the event is over)
  EVENT_END:   "2026-11-25T00:00:00+06:00",

  // Optional logo image URLs (leave "" to show a LOGO placeholder)
  LOGO_LEFT:  "",   // e.g. university logo
  LOGO_RIGHT: ""    // e.g. GBDS logo
};

/* ---------- logos ---------- */
function setLogo(id, url){
  const el = document.getElementById(id);
  if(!el || !url) return;
  el.textContent = "";
  const img = new Image();
  img.src = url; img.alt = "";
  el.appendChild(img);
}
setLogo("navLogo", CONFIG.LOGO_LEFT);
setLogo("footLogoL", CONFIG.LOGO_LEFT);
setLogo("footLogoR", CONFIG.LOGO_RIGHT);

/* ---------- countdown ---------- */
(function(){
  const start = new Date(CONFIG.EVENT_START).getTime();
  const end   = new Date(CONFIG.EVENT_END).getTime();
  const box = document.getElementById("countdown");
  const msg = document.getElementById("cdMsg");
  const label = document.getElementById("cdLabel");
  const els = {d:cdD,h:cdH,m:cdM,s:cdS};
  const pad = n => String(n).padStart(2,"0");

  function tick(){
    const now = Date.now();

    const diff = start - now;
    if(diff <= 0){
      box.classList.add("done");
      if(now >= end){
        label.textContent = "SEASON 04 COMPLETE";
        msg.textContent = "SEE YOU NEXT SEASON";
      }else{
        label.textContent = "LIVE NOW";
        msg.textContent = "THE MATCH HAS BEGUN";
      }
      return;
    }
    label.textContent = "DROP IN";
    const s = Math.floor(diff/1000);
    els.d.textContent = pad(Math.floor(s/86400));
    els.h.textContent = pad(Math.floor(s%86400/3600));
    els.m.textContent = pad(Math.floor(s%3600/60));
    els.s.textContent = pad(s%60);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
